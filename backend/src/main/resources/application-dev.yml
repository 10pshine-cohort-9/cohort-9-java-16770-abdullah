spring:
  datasource:
    url: jdbc:h2:mem:contactsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.abdullahadil.contactmanagement: DEBUG

app:
  jwt:
    # Dev-only fixed secret so the app can start without extra setup.
    # Never reuse this in a real environment - see application-prod.yml.
    secret: dev-only-insecure-secret-do-not-use-in-production-32chars+
    expiration-minutes: 60
